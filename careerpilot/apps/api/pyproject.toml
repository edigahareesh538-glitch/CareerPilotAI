[project]
name = "careerpilot-api"
version = "0.0.1"
description = "CareerPilot AI FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.0",
    "redis==5.0.0",
    "celery==5.3.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "python-magic==0.4.27",
    "httpx==0.27.0",
    "tenacity==8.2.0",
    "structlog==24.1.0",
    "opentelemetry-api==1.22.0",
    "opentelemetry-sdk==1.22.0",
    "opentelemetry-instrumentation-fastapi==0.42b0",
    "opentelemetry-instrumentation-sqlalchemy==0.42b0",
    "opentelemetry-exporter-otlp==1.22.0",
    "pgvector==0.2.3",
    "numpy==1.26.0",
    "pdfplumber==0.11.0",
    "python-docx==1.1.0",
    "email-validator==2.1.0",
    "authlib==1.3.0",
    "slowapi==0.1.9",
    "boto3==1.34.0",
    "minio==7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "pytest-cov==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "PTH", "SIM", "TID"]
ignore = ["S101"]
fix = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]